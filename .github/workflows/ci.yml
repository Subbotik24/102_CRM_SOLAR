name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:core

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run openapi:parity
      - run: pnpm --filter @workspace/api-spec run codegen
      - run: git diff --exit-code

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_solar_test
          POSTGRES_USER: crm_solar
          POSTGRES_PASSWORD: crm_solar_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_solar -d crm_solar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crm_solar:crm_solar_ci_only@127.0.0.1:5432/crm_solar_test
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:5173
      CORS_ORIGINS: http://127.0.0.1:5173
      SEED_ADMIN_EMAIL: admin@crm-solar.test
      SEED_ADMIN_PASSWORD: CI-only-admin-password-123!
      EMAIL_PROVIDER: console
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm --filter @workspace/api-server run db:seed
      - run: pnpm run test:integration

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_solar_e2e
          POSTGRES_USER: crm_solar
          POSTGRES_PASSWORD: crm_solar_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_solar -d crm_solar_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://crm_solar:crm_solar_ci_only@127.0.0.1:5432/crm_solar_e2e
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      APP_URL: http://127.0.0.1:5173
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SEED_ADMIN_EMAIL: admin@crm-solar.test
      SEED_ADMIN_PASSWORD: CI-only-admin-password-123!
      EMAIL_PROVIDER: console
      NODE_ENV: test
      PORT: 8080
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/tests exec playwright install --with-deps chromium
      - run: pnpm run db:migrate
      - run: pnpm --filter @workspace/api-server run db:seed
      - run: pnpm run test:e2e

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
