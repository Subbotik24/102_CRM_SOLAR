services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_solar
      POSTGRES_USER: crm_solar
      POSTGRES_PASSWORD: crm_solar_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_solar -d crm_solar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - crm-solar-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.26
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  crm-solar-postgres:
