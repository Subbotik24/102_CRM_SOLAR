      tags: [journal]
      summary: List a project's manual journal entries
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Entries, content: { application/json: { schema: { $ref: "#/components/schemas/LogEntryList" } } } } }
    post:
      operationId: createProjectLogEntry
      tags: [journal]
      summary: Create a manual journal entry
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LogEntryInput" } } } }
      responses: { "201": { description: Created entry, content: { application/json: { schema: { $ref: "#/components/schemas/LogEntry" } } } } }

  /log-entries/{id}:
    patch:
      operationId: updateProjectLogEntry
      tags: [journal]
      summary: Update a manual journal entry
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LogEntryInput" } } } }
      responses: { "200": { description: Updated entry, content: { application/json: { schema: { $ref: "#/components/schemas/LogEntry" } } } } }
    delete:
      operationId: deleteProjectLogEntry
      tags: [journal]
      summary: Soft-delete a manual journal entry
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Deleted entry } }

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file as an administrator or request deletion otherwise
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: File deleted }
        "202": { description: Deletion request created, content: { application/json: { schema: { $ref: "#/components/schemas/DeletionRequestAcknowledgement" } } } }
        "404": { description: File not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /projects/{id}/chronicle:
    get:
      operationId: exportProjectChronicle
      tags: [journal]
      summary: Export a project chronicle as Markdown or PDF
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: format, in: query, schema: { type: string, enum: [md, pdf], default: md } }]
      responses:
        "200":
          description: Downloadable chronicle
          content:
            text/markdown: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }

  /auth/invite/accept:
    post:
      operationId: acceptInvitation
      tags: [auth]
      summary: Accept a one-time invitation and create a session
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AcceptInvitationInput" } } } }
      responses:
        "201": { description: Account created, content: { application/json: { schema: { $ref: "#/components/schemas/AcceptedInvitationUser" } } } }
        "400": { description: "Invalid, expired or consumed invitation", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /deletion-requests/{id}/approve:
    post:
      operationId: approveDeletionRequest
      tags: [tasks]
      summary: Approve a pending task or file deletion request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Request approved and entity deleted } }

  /deletion-requests/{id}/reject:
    post:
      operationId: rejectDeletionRequest
      tags: [tasks]
      summary: Reject a pending task or file deletion request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "204": { description: Request rejected } }

components:
